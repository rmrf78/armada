name: Publish disk to release

on:
  workflow_dispatch:

permissions:
  contents: write
  actions: read

jobs:
  publish:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 120
    steps:
      - name: Download built disk artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euxo pipefail
          mkdir -p dist
          gh run download 42566762186 \
            --repo "${{ github.repository }}" \
            -n armada-kde-disk -D dist
          ls -lh dist

      - name: Split and publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euxo pipefail
          shopt -s nullglob
          imgs=(dist/armada-*.img.gz)
          [ "${#imgs[@]}" -eq 1 ]
          img="${imgs[0]}"
          base="$(basename "${img}")"
          tag="disk-$(date -u +%Y%m%d)-${GITHUB_RUN_ID}"
          split -b 1900M -d -a 2 "${img}" "dist/${base}.part"
          (cd dist && sha256sum "${base}" > "${base}.sha256")
          cat >dist/JOIN.txt <<JOIN
          cat ${base}.part* > ${base}
          sha256sum -c ${base}.sha256
          gunzip -k ${base}
          JOIN
          gh release create "${tag}" \
            --repo "${{ github.repository }}" \
            --title "Armada KDE disk ${tag}" \
            --notes "Split disk image generated by build-kde-disk. Join parts per JOIN.txt, then flash the .img with EDL." || true
          gh release upload "${tag}" \
            --repo "${{ github.repository }}" \
            dist/${base}.part* dist/${base}.sha256 dist/JOIN.txt --clobber
          echo "https://github.com/${{ github.repository }}/releases/tag/${tag}" >> "${GITHUB_STEP_SUMMARY}"
